substitutions:
  name: raingeled
  friendly_name: Raingel LED
  # >>> REPLACE with your leds's actual MAC <<<
  # >>> A REMPLACER par la MAC réelle de tes leds <<<
  led_mac: "XX:XX:XX:XX:XX:XX"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  reboot_timeout: 0s
  actions:
    - action: set_effect
      variables:
        mode_id: int
        palette_index: int
        speed: int
        brightness: int
        is_magic: bool
      then:
        - lambda: |-
            if (is_magic) {
              id(raingeled).set_effect_magic(mode_id, palette_index, speed, brightness);
            } else {
              id(raingeled).set_effect_rgb(mode_id, palette_index, speed, brightness);
            }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- Bluetooth Low Energy ---------------------------------------------------

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${led_mac}
    id: raingeled
    auto_connect: true

# --- Composant custom "raingeled" ----------------------------------------------

external_components:
  - source:
      type: local
      path: external_components
    components: [raingeled]

light:
  - platform: raingel
    default_transition_length: 0s
    gamma_correct: 1.0
    ble_client_id: raingeled
    id: raingeled_light            # LightState (entité HA)
    output_id: raingeled_raingel
    name: ${friendly_name}
    restore_mode: ALWAYS_OFF
    service_uuid: "AE30"
    characteristic_uuid: "AE01"
